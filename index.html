<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=./frontend/">
    <title>CineSearch - Yönlendiriliyor...</title>
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #16213e 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        .loading {
            text-align: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #8338ec;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #ff006e;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <h2>CineSearch yükleniyor...</h2>
        <p>Otomatik yönlendirilmiyorsanız <a href="./frontend/">tıklayın</a></p>
    </div>
</body>
</html>
